<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محفظتي العقارية — لوحة التحكم</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="logo-mark">🏠</span><div><b>محفظتي العقارية</b><small id="ownerName">المالك</small></div></div>
    <nav id="nav"></nav>
    <div class="side-user"><div><b id="userName">…</b><small id="userRole"></small></div><button class="icon-btn" title="تسجيل الخروج" onclick="logout()">⏻</button></div>
    <div class="side-foot"><span id="dbBadge" class="badge">…</span><span id="today"></span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <h1 id="viewTitle">لوحة التحكم</h1>
      <div class="top-actions">
        <input id="globalSearch" placeholder="بحث سريع… (وحدة، مستأجر)" oninput="globalSearch(this.value)">
        <button class="icon-btn" title="التنبيهات" onclick="go('dashboard');setTimeout(()=>document.getElementById('alerts')?.scrollIntoView({behavior:'smooth'}),50)">🔔<span id="alertCount" class="pill">0</span></button>
        <button class="btn primary" onclick="go('assistant')">✨ اسأل</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="modalForm" onsubmit="return false"></form><div class="modal-foot" id="modalFoot"></div></div></div>
<div id="drawer" class="drawer"><div class="drawer-box"><div class="modal-head"><h3 id="drawerTitle"></h3><button class="icon-btn" onclick="closeDrawer()">✕</button></div><div id="drawerBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
